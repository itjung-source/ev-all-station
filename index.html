function poiIcon(p){return p.icon||'★';}
function fmtKm(d,ap){return (ap?'~':'')+(d<10?d.toFixed(1):Math.round(d))+' กม.';}
// รายการระยะทางถนนไป POI เรียงใกล้->ไกล; skipIdx = POI ตัวเอง (ไม่แสดง)
function distListHtml(dists,approx,skipIdx){
 if(!D.poi||!D.poi.length||!dists) return '';
 var items=D.poi.map(function(p,i){return {p:p,i:i,d:dists[i],a:approx?approx[i]:0};})
  .filter(function(x){return x.i!==skipIdx&&x.d!=null;})
  .sort(function(a,b){return a.d-b.d;});
 if(!items.length) return '';
 return '<div class="poibox">🚗 ระยะทางถนนไป'+(skipIdx==null?'จุดสนใจ':'จุดสนใจอื่น')+':<br>'+
  items.map(function(x){return poiIcon(x.p)+' '+x.p.name+' <b>'+fmtKm(x.d,x.a)+'</b>';}).join('<br>')+
  (items.some(function(x){return x.a;})?'<br><small style="color:#666">~ = ระยะเส้นตรง (หาเส้นทางถนนไม่ได้)</small>':'')+'</div>';
}

  }else{

  }
  function sideHtml(s){if(!s.side)return '';const city=s.pref==='กรุงเทพมหานคร'?'กรุงเทพฯ':s.pref;
   const col=s.side==='ขาออก'?'#2e7d32':'#1565c0';

});
let poiBounds=null, placeLabels=function(){};
if(D.poi&&D.poi.length){
 const pg=L.layerGroup(), poiMarkers=[], G=14;
 function bindLabel(m,dir,off){
  var key=dir+':'+off[0]+','+off[1]; if(m._labelKey===key) return;
  m.unbindTooltip();m.bindTooltip(m._poiName,{permanent:true,direction:dir,offset:off,className:'poilabel'});m._labelKey=key;}
 D.poi.forEach(function(p,i){
  var m=L.marker([p.lat,p.lng],{icon:L.divIcon({html:'<div class="poipin">'+poiIcon(p)+'</div>',className:'',iconSize:[26,26],iconAnchor:[13,13]}),zIndexOffset:1000})

     distListHtml(D.poiDist&&D.poiDist[i],D.poiApprox&&D.poiApprox[i],i)+

  m._poiName=p.name; poiMarkers.push(m); m.addTo(pg);
 });

 // วางป้ายชื่อบนหน้าจอจริง: แต่ละป้ายลองตำแหน่งรอบหมุด (บน/ขวา/ซ้าย/ล่าง แล้วค่อยเยื้องอีกชั้น/มุมเฉียง)
 // เลือกตำแหน่งแรกที่ทับป้ายที่วางแล้ว+หมุด POI อื่นน้อยสุด — คำนวณใหม่ทุกครั้งที่ซูม (ระยะบนจอเปลี่ยนตาม zoom)
 placeLabels=function(){
  if(!map.hasLayer(pg)) return;
  var pts=poiMarkers.map(function(m){return map.latLngToContainerPoint(m.getLatLng());});
  function area(a,b){var w=Math.min(a.r,b.r)-Math.max(a.l,b.l),h=Math.min(a.b,b.b)-Math.max(a.t,b.t);return (w>0&&h>0)?w*h:0;}
  function box(c,s,dir,o){
   if(dir==='top')    return {l:c.x+o[0]-s.w/2,r:c.x+o[0]+s.w/2,t:c.y+o[1]-s.h,b:c.y+o[1]};
   if(dir==='bottom') return {l:c.x+o[0]-s.w/2,r:c.x+o[0]+s.w/2,t:c.y+o[1],b:c.y+o[1]+s.h};
   if(dir==='right')  return {l:c.x+o[0],r:c.x+o[0]+s.w,t:c.y+o[1]-s.h/2,b:c.y+o[1]+s.h/2};
   return {l:c.x+o[0]-s.w,r:c.x+o[0],t:c.y+o[1]-s.h/2,b:c.y+o[1]+s.h/2};
  }
  var placed=[];
  poiMarkers.forEach(function(m,i){
   if(!m._size){var el=m.getTooltip()&&m.getTooltip().getElement();if(el){var r=el.getBoundingClientRect();m._size={w:r.width,h:r.height};}}
   var s=m._size||{w:120,h:28}, c=pts[i], H=s.h+2;
   var cands=[['top',[0,-G]],['right',[G,0]],['left',[-G,0]],['bottom',[0,G]],
              ['top',[0,-G-H]],['bottom',[0,G+H]],
              ['right',[G,-H]],['right',[G,H]],['left',[-G,-H]],['left',[-G,H]]];
   var obst=placed.concat(pts.filter(function(_,j){return j!==i;}).map(function(p){return {l:p.x-20,r:p.x+20,t:p.y-20,b:p.y+20};}));
   var best=cands[0],bestBox=null,bestCost=Infinity;
   cands.forEach(function(cd){
    var bx=box(c,s,cd[0],cd[1]);
    var cost=obst.reduce(function(acc,o){return acc+area(bx,o);},0);
    if(cost<bestCost){bestCost=cost;best=cd;bestBox=bx;}
   });
   placed.push(bestBox);
   bindLabel(m,best[0],best[1]);
  });
 };
 map.on('zoomend',placeLabels);
 map.on('overlayadd',function(e){if(e.layer===pg)placeLabels();});
 overlays['📍 สถานที่น่าสนใจ ('+D.poi.length+' ที่)']=pg;
 poiBounds=L.latLngBounds(D.poi.map(function(p){return [p.lat,p.lng];}));
}
